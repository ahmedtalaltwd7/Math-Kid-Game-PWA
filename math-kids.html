<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>نجوم الرياضيات</title>
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نجوم الرياضيات">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%237c3aed'/%3E%3Ctext x='256' y='340' font-size='300' text-anchor='middle'%3E⭐%3C/text%3E%3C/svg%3E">
<link rel="manifest" id="manifest">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#fef3c7,#fbcfe8 55%,#c4b5fd);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.key{touch-action:manipulation;transition:transform .08s}
.key:active{transform:scale(.92)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
.box{min-width:3.2rem;height:4rem;border-bottom:5px solid #7c3aed;display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="max-w-md mx-auto h-full flex flex-col p-3 gap-2">

  <header class="flex items-center justify-between">
    <div id="starBox" class="bg-white/80 rounded-full px-4 py-1 text-2xl font-bold text-amber-500 shadow flex items-center gap-2">
      <i class="fa-solid fa-star"></i><span id="stars">0</span>
    </div>
    <div class="text-sm font-bold text-purple-700 bg-white/70 rounded-full px-3 py-1">
      <i class="fa-solid fa-trophy"></i> جولات: <span id="rounds">0</span>
    </div>
    <button id="resetBtn" class="w-10 h-10 rounded-full bg-white/80 text-rose-500 shadow" aria-label="إعادة ضبط">
      <i class="fa-solid fa-rotate-left"></i>
    </button>
  </header>

  <nav class="grid grid-cols-3 gap-2" id="tabs"></nav>

  <div class="flex justify-center gap-2" id="dots"></div>

  <main class="flex-1 min-h-0 bg-white/90 rounded-3xl shadow-lg flex flex-col items-center justify-center" id="card">
    <div id="problem" dir="ltr" class="text-5xl font-extrabold text-purple-800"></div>
    <div id="msg" class="h-8 mt-3 text-xl font-bold"></div>
  </main>

  <section class="grid grid-cols-3 gap-2" id="pad"></section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'mathStars.v1';
  const LV = [
    {n: 'جمع', icon: 'fa-plus', c: 'bg-emerald-500'},
    {n: 'طرح', icon: 'fa-minus', c: 'bg-sky-500'},
    {n: 'جمع عمودي', icon: 'fa-bars-staggered', c: 'bg-orange-500'}
  ];
  let S = {stars: 0, level: 0, rounds: [0, 0, 0]};
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  let streak = 0, cur = null, ans = '', busy = false;

  /* ---------- Audio ---------- */
  let ac;
  const tone = (f, t = .12, type = 'sine', v = .15, d = 0) => {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + d;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + t);
      o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + t);
    } catch (e) {}
  };
  const sTap = () => tone(520, .06, 'triangle', .1);
  const sOk = () => [523, 659, 784].forEach((f, i) => tone(f, .18, 'sine', .15, i * .1));
  const sBad = () => { tone(220, .2, 'triangle', .12); tone(180, .25, 'triangle', .12, .15); };
  const speak = txt => {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'en-US'; u.rate = .9; u.pitch = 1.2;
      speechSynthesis.speak(u);
    } catch (e) {}
  };

  /* ---------- Problems ---------- */
  const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function gen() {
    let a, b, last = cur ? cur.a + '|' + cur.b : '';
    do {
      if (S.level === 0) { a = r(1, 19); b = r(1, 20 - a); }
      else if (S.level === 1) { a = r(2, 20); b = r(1, a); }
      else { a = r(5, 24); b = r(3, Math.max(3, 28 - a)); if (a + b > 28) b = 28 - a; }
    } while (a + '|' + b === last);
    cur = {a, b, res: S.level === 1 ? a - b : a + b};
  }

  /* ---------- Render ---------- */
  function render() {
    $('stars').textContent = S.stars;
    $('rounds').textContent = S.rounds.reduce((x, y) => x + y, 0);
    document.querySelectorAll('#tabs button').forEach((b, i) => {
      b.className = 'key rounded-2xl py-2 font-bold text-white shadow flex flex-col items-center text-sm ' +
        LV[i].c + (i === S.level ? ' ring-4 ring-white scale-105' : ' opacity-60');
    });
    $('dots').innerHTML = [0, 1, 2, 3, 4].map(i =>
      `<i class="fa-solid fa-star text-2xl ${i < streak ? 'text-amber-400' : 'text-white/80'}"></i>`).join('');
    const out = ans === '' ? '&nbsp;' : ans;
    if (S.level === 2) {
      const pad = n => String(n).padStart(2, '\u00A0');
      $('problem').innerHTML = `<div class="inline-block text-right leading-tight tracking-widest" style="font-size:3.6rem">
        <div>${pad(cur.a).replace(/ /g, '&nbsp;')}</div>
        <div class="flex justify-between"><span class="text-emerald-600">+</span><span>${pad(cur.b).replace(/ /g, '&nbsp;')}</span></div>
        <div class="border-t-8 border-purple-700 my-1"></div>
        <div class="flex justify-end"><span class="box">${out}</span></div></div>`;
    } else {
      $('problem').innerHTML = `<span>${cur.a}</span> <span class="${S.level ? 'text-sky-500' : 'text-emerald-500'}">${S.level ? '−' : '+'}</span> <span>${cur.b}</span> <span>=</span> <span class="box">${out}</span>`;
    }
  }
  function setMsg(t, cls) { $('msg').className = 'h-8 mt-3 text-xl font-bold ' + cls; $('msg').textContent = t; }
  function next() { gen(); ans = ''; busy = false; render(); }

  /* ---------- Interaction ---------- */
  function press(k) {
    if (busy) return;
    sTap();
    if (k === 'del') ans = ans.slice(0, -1);
    else if (ans.length < 2) ans += k;
    setMsg('', ''); render();
  }
  function check() {
    if (busy) return;
    if (ans === '') { sBad(); setMsg('اكتب الجواب أولاً 😊', 'text-purple-600'); return; }
    if (+ans === cur.res) {
      busy = true; sOk(); S.stars++; streak++;
      setMsg(['أحسنت! 🎉', 'رائع! ⭐', 'ممتاز! 👏', 'شاطر! 🌟'][r(0, 3)], 'text-emerald-600');
      $('starBox').classList.remove('pop'); void $('starBox').offsetWidth; $('starBox').classList.add('pop');
      if (streak >= 5) {
        S.rounds[S.level]++; streak = 0;
        speak('I am proud of you');
        if (window.confetti) {
          const end = Date.now() + 2200;
          (function f() {
            confetti({particleCount: 7, angle: 60, spread: 70, origin: {x: 0, y: .8}, zIndex: 9999});
            confetti({particleCount: 7, angle: 120, spread: 70, origin: {x: 1, y: .8}, zIndex: 9999});
            if (Date.now() < end) requestAnimationFrame(f);
          })();
          confetti({particleCount: 150, spread: 120, origin: {y: .5}, zIndex: 9999});
        }
        setMsg('أنا فخورٌ بك! 🏆', 'text-amber-500');
        save(); render(); setTimeout(next, 2400);
      } else { save(); render(); setTimeout(next, 900); }
    } else {
      sBad(); streak = 0; ans = '';
      $('problem').classList.add('shake'); setTimeout(() => $('problem').classList.remove('shake'), 400);
      setMsg('حاول مرة أخرى 💪', 'text-rose-500'); save(); render();
    }
  }

  /* ---------- Build UI ---------- */
  $('tabs').innerHTML = LV.map((l, i) =>
    `<button data-l="${i}"><i class="fa-solid ${l.icon} text-xl"></i><span>${l.n}</span></button>`).join('');
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.level = +b.dataset.l; streak = 0; sTap(); save(); setMsg('', ''); next();
  });
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','ok'];
  $('pad').innerHTML = keys.map(k => {
    const base = 'key h-16 rounded-2xl text-3xl font-extrabold shadow-md ';
    if (k === 'del') return `<button data-k="del" class="${base} bg-rose-400 text-white" aria-label="مسح"><i class="fa-solid fa-delete-left"></i></button>`;
    if (k === 'ok') return `<button data-k="ok" class="${base} bg-emerald-500 text-white" aria-label="تحقق"><i class="fa-solid fa-check"></i></button>`;
    return `<button data-k="${k}" class="${base} bg-white text-purple-700">${k}</button>`;
  }).join('');
  $('pad').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    b.dataset.k === 'ok' ? check() : press(b.dataset.k);
  });
  $('resetBtn').addEventListener('click', () => {
    if (confirm('هل تريد مسح كل النجوم والبدء من جديد؟')) {
      S = {stars: 0, level: 0, rounds: [0, 0, 0]}; streak = 0; save(); setMsg('', ''); next();
    }
  });
  document.addEventListener('keydown', e => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter') check();
  });
  document.addEventListener('dblclick', e => e.preventDefault());

  /* ---------- PWA: manifest (Data URI) ---------- */
  const icon = "data:image/svg+xml," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='#7c3aed'/><text x='256' y='350' font-size='300' text-anchor='middle'>⭐</text></svg>");
  const manifest = {
    name: 'نجوم الرياضيات', short_name: 'نجوم', lang: 'ar', dir: 'rtl',
    display: 'standalone', orientation: 'portrait', background_color: '#fef3c7', theme_color: '#7c3aed',
    start_url: location.href.split('#')[0],
    icons: [{src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'},
            {src: icon, sizes: '192x192', type: 'image/svg+xml'}]
  };
  $('manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));

  /* ---------- PWA: Service Worker (Blob URL، مع بديل sw.js) ---------- */
  const SW = `
const C='math-stars-v1';
const CDN=['https://cdn.tailwindcss.com/3.4.17','https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js','https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js'];
self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(async c=>{
  await c.add(new Request(self.registration.scope,{cache:'reload'})).catch(()=>{});
  await Promise.all(CDN.map(u=>fetch(u,{mode:'no-cors'}).then(r=>c.put(u,r)).catch(()=>{})));
}))});
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(caches.match(e.request,{ignoreSearch:true}).then(hit=>hit||fetch(e.request).then(res=>{
    if(res&&(res.ok||res.type==='opaque')){const cp=res.clone();caches.open(C).then(c=>c.put(e.request,cp))}
    return res;
  }).catch(()=>e.request.mode==='navigate'?caches.match(self.registration.scope):undefined)));
});`;
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const url = URL.createObjectURL(new Blob([SW], {type: 'text/javascript'}));
    navigator.serviceWorker.register(url).catch(() =>
      // المتصفحات ترفض غالباً سجلّ blob: — نجرب ملف sw.js بجانب الصفحة
      navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  gen(); render();
})();
</script>
</body>
</html>
